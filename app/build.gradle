plugins { id 'com.android.application' }

android {
    namespace 'com.estiuk.studyxp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.istii.thegreat'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    // Fixed debug key: every build is signed the same way, so new APKs install as updates (data is kept).
    signingConfigs {
        debug {
            storeFile file('istii-debug.jks')
            storePassword 'istii123456'
            keyAlias 'istii'
            keyPassword 'istii123456'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}
